[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-power-adapter-sdk"
version = "0.1.0"
description = "Vendor-neutral portable power adapter interfaces and Home Assistant MQTT Discovery publisher"
requires-python = ">=3.11"
dependencies = ["portalocker>=3,<4", "paho-mqtt>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jinja2>=3.1,<4"]

[project.scripts]
portable-power = "portable_power_sdk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
